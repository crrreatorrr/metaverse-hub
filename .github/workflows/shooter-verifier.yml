name: shooter-verifier
on:
  pull_request:
    paths: ['services/shooter-verifier/**', 'server/modules/vendor/shooter-sim*', '.github/workflows/shooter-verifier.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  process-and-container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Actual process faults and resource limits
        run: |
          node --test services/shooter-verifier/test/runtime.test.mjs
          node --test services/shooter-verifier/test/artifact-retention.test.mjs
      - name: Build test artifact (no service deployment)
        run: docker compose -f services/shooter-verifier/compose.test.yml build
      - name: Exercise offline read-only bounded container
        run: docker compose -f services/shooter-verifier/compose.test.yml run --rm verifier-test
      - name: Native memory is bounded by the container, independently of V8 heap
        shell: bash
        run: |
          set +e
          docker run --rm --network none --read-only --memory 64m --memory-swap 64m --pids-limit 16 --cpus 1 --cap-drop ALL --security-opt no-new-privileges --ulimit core=0 --entrypoint node shooter-verifier-pr09:test -e 'const a=[];for(;;)a.push(Buffer.alloc(8*1024*1024,1))'
          code=$?
          set -e
          test "$code" -eq 137
  corpus-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: crrreatorrr/sproto-shooter
          ref: 05f7a0a245af921fc65a99588564175c19658e38
          path: source-corpus
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Every full frozen trace through bounded process slices
        env:
          SHOOTER_CORPUS_DIR: source-corpus/tests/fixtures/replay-corpus
        run: node --test services/shooter-verifier/test/corpus.test.mjs

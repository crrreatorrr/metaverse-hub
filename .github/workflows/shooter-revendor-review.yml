name: shooter-revendor-review
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: shooter-revendor-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  revendor:
    if: github.event.pull_request.number == 129 && github.event.pull_request.head.repo.full_name == 'crrreatorrr/metaverse-hub' && github.event.pull_request.head.ref == 'cursor/shooter-pvp-revendor-03e4'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
      - run: npm ci
      - name: Run official full re-vendor
        run: node scripts/revendor-shooter-pvp.mjs f2034e7b3a22ebfb451b46ba77279b97eb945c50
      - name: Verify upstream pins
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/check-shooter-pvp-sim-version.mjs
          node scripts/check-shooter-sim-version.mjs
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
        env:
          SHOOTER_REQUIRE_GOJA: '1'
          GOTOOLCHAIN: local
      - run: npm run build
        env:
          VITE_NAKAMA_SERVER_KEY: ci-build-placeholder-not-a-server-key
      - name: Export verified tracked changes
        run: |
          git diff --check
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { readFileSync } from 'node:fs';
          const paths = execFileSync('git', ['diff', '--name-only', '--diff-filter=ACM', '-z'], { encoding: 'utf8' }).split('\0').filter(Boolean);
          const allowed = new Set(["scripts/check-shooter-pvp-sim-version.mjs","scripts/check-shooter-sim-version.mjs","scripts/load/shooter-bots.ts","scripts/load/shooter-acceptance.ts","scripts/revendor-shooter-pvp.test.mjs","server/test/games/shooter_match.test.ts","server/test/games/shooter_review.test.ts","server/test/games/shooter_wagers.test.ts","server/test/dup/shooter_match.ts","server/test/rt/realtime.test.ts","docs/two-game-release.md","server/modules/src/games/shooter_protocol.ts","server/modules/src/games/shooter_rewards.ts","server/modules/vendor/shooter-pvp-sim.js","server/modules/vendor/shooter-pvp-sim.pin.json","server/modules/vendor/shooter-sim.js","server/modules/vendor/shooter-sim.pin.json"]);
          for (const path of paths) {
            if (!allowed.has(path)) throw new Error('Unexpected generated path: ' + path);
            const bytes = readFileSync(path);
            const sha = execFileSync('git', ['hash-object', '--', path], { encoding: 'utf8' }).trim();
            const encoded = bytes.toString('base64');
            const count = Math.ceil(encoded.length / 16384);
            console.log('REVENDOR_FILE ' + JSON.stringify({ path, sha, bytes: bytes.length, count }));
            for (let index = 0; index < count; index++) console.log('REVENDOR_CHUNK ' + JSON.stringify({ path, index, data: encoded.slice(index * 16384, (index + 1) * 16384) }));
          }
          console.log('REVENDOR_DONE ' + JSON.stringify({ count: paths.length }));
          NODE

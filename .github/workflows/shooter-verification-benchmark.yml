name: shooter-verification-benchmark-tooling
on:
  pull_request:
    paths:
      - scripts/load/shooter-campaign-verification.ts
      - scripts/load/shooter-benchmark/**
      - docs/shooter-verification/benchmark-method.md
      - .github/workflows/shooter-verification-benchmark.yml
concurrency:
  group: shooter-benchmark-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check benchmark tooling
        run: npx tsc -p scripts/load/shooter-benchmark/tsconfig.json --noEmit
      - name: Validate bounded scheduling and honest accounting
        run: |
          npx tsx scripts/load/shooter-benchmark/contracts.test.ts
          npx tsx scripts/load/shooter-benchmark/observers.test.ts
          npx tsx scripts/load/shooter-benchmark/container-observer.test.ts
          npx tsx scripts/load/shooter-benchmark/result-validation.test.ts
          npx tsx scripts/load/shooter-benchmark/coverage.test.ts
          npx tsx scripts/load/shooter-benchmark/metric-read-disposition.test.ts
          npx tsx scripts/load/shooter-benchmark/metric-read-lifetime.test.ts
          npx tsx scripts/load/shooter-benchmark/background-policy.test.ts
          npx tsx scripts/load/shooter-benchmark/control.test.ts
          npx tsx scripts/load/shooter-benchmark/rpc.test.ts
          npx tsx scripts/load/shooter-benchmark/evidence-codec.test.ts
          npx tsx scripts/load/shooter-benchmark/finish-barrier.test.ts
          npx tsx scripts/load/shooter-benchmark/client-gate.test.ts
          npx tsx scripts/load/shooter-benchmark/client-validation.test.ts
          npx tsx scripts/load/shooter-benchmark/cohort-preparation.test.ts
          node --test scripts/load/shooter-benchmark/browser-drain.test.mjs
          npx tsx scripts/load/shooter-benchmark/browser-observer.test.ts
          npx tsx scripts/load/shooter-benchmark/browser-accounting.test.ts
          node --test scripts/load/shooter-benchmark/worker-lifecycle.test.mjs
          node scripts/load/shooter-benchmark/metrics-collector.test.mjs
          node scripts/load/shooter-benchmark/gateway-observer.test.mjs
          node --test scripts/load/shooter-benchmark/instrument-result-stages.test.mjs
          node --test scripts/load/shooter-benchmark/result-stage-collector.test.mjs
          npx tsx scripts/load/shooter-benchmark/legacy-policy.test.ts
      - name: Lint benchmark tooling
        run: npx eslint scripts/load/shooter-campaign-verification.ts scripts/load/shooter-benchmark
  twenty-independent-real-pipeline:
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        command: [run, run-lifecycle, run-sustained, run-legacy-full, run-legacy-segmented]
    env:
      HUB_SHOOTER_FIXTURE: benchmark
      SHOOTER_OPS_CI_DIRECTORY: /tmp/shooter-benchmark-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: crrreatorrr/sproto-shooter
          ref: 05f7a0a245af921fc65a99588564175c19658e38
          path: .ci-shooter
          sparse-checkout: tests/fixtures/replay-corpus
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Throwaway credentials for disposable stack
        run: |
          set -eu
          sh server/scripts/dev-env.sh --random-server-key
          echo 'NAKAMA_TEST_MAX_REQUEST_BYTES=23068672' >> server/.env
          sed -n 's/^[A-Z_]*=//p' server/.env | while read -r value; do echo "::add-mask::${value}"; done
          for name in NAKAMA_SERVER_KEY NAKAMA_HTTP_KEY; do
            echo "${name}=$(sed -n "s/^${name}=//p" server/.env)" >> "$GITHUB_ENV"
          done
      - name: Boot ephemeral Nakama and PostgreSQL
        run: docker compose -f server/docker-compose.yml up -d --build --wait --wait-timeout 180 postgres nakama
      - name: Explicit finite fixture config and scoped principal
        run: |
          npx tsx scripts/load/shooter-benchmark/ci.ts prepare
          sudo chown -R 1000:1000 "$SHOOTER_OPS_CI_DIRECTORY/socket" "$SHOOTER_OPS_CI_DIRECTORY/journal" "$SHOOTER_OPS_CI_DIRECTORY/shooter-worker.json"
      - name: Actual fenced coordinator and network-isolated replay containers
        run: docker compose -f server/docker-compose.yml -f services/shooter-verifier/ops/compose.ci.yml -f scripts/load/shooter-benchmark/compose.ci.yml --profile shooter-verification up -d --build --no-deps replay coordinator metrics-observer
      - name: Full twenty independent authenticated actors with Hub and free PvP observers
        run: npx tsx scripts/load/shooter-benchmark/ci.ts ${{ matrix.command }}
        env:
          SHOOTER_CORPUS_DIR: ${{ github.workspace }}/.ci-shooter/tests/fixtures/replay-corpus
      - name: Retain safe advisory report only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shooter-ci-advisory-benchmark-${{ matrix.command }}
          path: |
            /tmp/shooter-benchmark-${{ github.run_id }}/benchmark-report.json
            /tmp/shooter-benchmark-${{ github.run_id }}/benchmark-failure.json
          if-no-files-found: warn
      - name: Stop and delete disposable stack
        if: always()
        run: |
          docker compose -f server/docker-compose.yml -f services/shooter-verifier/ops/compose.ci.yml -f scripts/load/shooter-benchmark/compose.ci.yml --profile shooter-verification down --volumes
          sudo rm -rf "$SHOOTER_OPS_CI_DIRECTORY"

name: shooter-verification-retention
on:
  pull_request:
    paths:
      - services/shooter-verifier/test/restore-continuation.mjs
      - server/modules/src/games/shooter_verification_*.ts
      - server/test/dup/shooter_verification_*.ts
      - server/test/dup/suite.ts
      - server/test/games/shooter_verification_retention.test.ts
      - server/test/unit/dup-reporter.test.ts
      - .github/workflows/shooter-verification-retention.yml
permissions:
  contents: read
jobs:
  recovery-and-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: crrreatorrr/sproto-shooter
          ref: 2215995f40d999f31336815296e1e7b7726f932a
          path: .ci-shooter
          sparse-checkout: tests/fixtures/replay-corpus
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Financial boundary and actual reporter process canaries
        run: |
          npx tsx server/test/games/shooter_verification_retention.test.ts
          npx tsx server/test/unit/dup-reporter.test.ts
      - name: Throwaway TLS certificate for gateway refusal cases
        run: openssl req -x509 -newkey rsa:2048 -nodes -keyout /tmp/test-worker.key -out /tmp/test-worker.crt -days 1 -subj /CN=localhost
      - name: Generate throwaway test-stack credentials
        run: |
          set -eu
          sh server/scripts/dev-env.sh --random-server-key
          echo 'NAKAMA_TEST_MAX_REQUEST_BYTES=23068672' >> server/.env
          sed -n 's/^[A-Z_]*=//p' server/.env | while read -r value; do echo "::add-mask::${value}"; done
          for name in NAKAMA_SERVER_KEY NAKAMA_HTTP_KEY; do
            echo "${name}=$(sed -n "s/^${name}=//p" server/.env)" >> "$GITHUB_ENV"
          done
      - name: Boot ephemeral Nakama and PostgreSQL
        run: docker compose -f server/docker-compose.yml up -d --build --wait --wait-timeout 180
      - name: Actual backup restore, approved continuation, cleanup race and cumulative recovery bounds
        run: npm run test:dup
        env:
          DUP_ONLY: shooter-verification,shooter-retention
          HUB_RECOVERY_FIXTURE: retention-restore
          SHOOTER_CORPUS: ${{ github.workspace }}/.ci-shooter/tests/fixtures/replay-corpus
          TEST_TLS_KEY: /tmp/test-worker.key
          TEST_TLS_CERT: /tmp/test-worker.crt
      - name: Show bounded SQL error context on failure
        if: failure()
        run: |
          docker compose -f server/docker-compose.yml logs --no-color --tail 60 postgres | python3 -c 'import sys; [print(line[:1000].rstrip()) for line in sys.stdin if "ERROR:" in line or "CONTEXT:" in line]'
      - name: Stop test services
        if: always()
        run: docker compose -f server/docker-compose.yml down --volumes

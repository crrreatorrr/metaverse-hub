name: shooter-verification-lifecycle
on:
  pull_request:
    paths:
      - server/modules/src/games/shooter_verification_*.ts
      - server/modules/src/games/shooter_runs.ts
      - server/modules/src/main.ts
      - server/test/dup/shooter_verification_*.ts
      - server/test/dup/suite.ts
      - server/test/games/shooter_verification_lifecycle.test.ts
      - .github/workflows/shooter-verification-lifecycle.yml
permissions:
  contents: read
jobs:
  lifecycle-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: crrreatorrr/sproto-shooter
          ref: dce559c523d6e9ce007126317b12042608864c3e
          path: .ci-shooter
          sparse-checkout: tests/fixtures/replay-corpus
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate throwaway test-stack credentials
        run: |
          set -eu
          sh server/scripts/dev-env.sh --random-server-key
          echo 'NAKAMA_TEST_MAX_REQUEST_BYTES=23068672' >> server/.env
          sed -n 's/^[A-Z_]*=//p' server/.env | while read -r value; do echo "::add-mask::${value}"; done
          for name in NAKAMA_SERVER_KEY NAKAMA_HTTP_KEY; do
            echo "${name}=$(sed -n "s/^${name}=//p" server/.env)" >> "$GITHUB_ENV"
          done
      - name: Boot ephemeral Nakama and PostgreSQL
        run: docker compose -f server/docker-compose.yml up -d --build --wait --wait-timeout 180
      - name: Actual default-off version/issue/seal/expiry/worker matrix
        run: npm run test:dup
        env:
          DUP_ONLY: shooter-lifecycle
          SHOOTER_CORPUS: ${{ github.workspace }}/.ci-shooter/tests/fixtures/replay-corpus
      - name: Selected lifecycle suite cannot silently pass with zero tests
        run: |
          if npm run test:dup > /tmp/lifecycle-empty-suite.log 2>&1; then
            cat /tmp/lifecycle-empty-suite.log
            echo 'Expected selected lifecycle suite without matching tests to fail'
            exit 1
          fi
          grep -F 'shooter-lifecycle: category produced no pass, failing the suite' /tmp/lifecycle-empty-suite.log
        env:
          DUP_ONLY: shooter-lifecycle
          DUP_NAME: intentionally-unmatched-zero-pass-sentinel
          SHOOTER_CORPUS: ${{ github.workspace }}/.ci-shooter/tests/fixtures/replay-corpus
      - name: Bounded failed-boot diagnostics
        if: failure()
        run: docker compose -f server/docker-compose.yml logs --tail=100 nakama
      - name: Stop throwaway services
        if: always()
        run: docker compose -f server/docker-compose.yml down --volumes

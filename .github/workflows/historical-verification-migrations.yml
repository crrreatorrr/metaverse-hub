name: historical-verification-migrations
on:
  pull_request:
    paths:
      - server/test/dup/migrations.ts
      - server/modules/src/games/shooter_verification_*.ts
      - server/modules/src/schema.ts
      - .github/workflows/historical-verification-migrations.yml
permissions:
  contents: read
jobs:
  historical-and-inorder:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Actual strict reporter failure and empty-selection canaries
        run: npx tsx server/test/unit/dup-reporter.test.ts
      - name: Generate disposable test-stack credentials
        run: |
          set -eu
          sh server/scripts/dev-env.sh --random-server-key
          sed -n 's/^[A-Z_]*=//p' server/.env | while read -r value; do echo "::add-mask::${value}"; done
          for name in NAKAMA_SERVER_KEY NAKAMA_HTTP_KEY; do
            echo "${name}=$(sed -n "s/^${name}=//p" server/.env)" >> "$GITHUB_ENV"
          done
      - name: Boot ephemeral current schema
        run: docker compose -f server/docker-compose.yml up -d --build --wait --wait-timeout 180
      - name: Real historical PB replay, concurrent/cold boots, guards, genuine latest upgrade and v2 populated regression
        run: npm run test:dup
        env:
          DUP_ONLY: migration,shooter-verification
          HUB_MIGRATION_FIXTURE: verification-history
      - name: Bounded failure diagnostics
        if: failure()
        run: |
          docker compose -f server/docker-compose.yml logs --no-color --tail 40 postgres | python3 -c 'import sys; [print(line[:1000].rstrip()) for line in sys.stdin if "ERROR:" in line or "CONTEXT:" in line]'
      - name: Stop disposable stack
        if: always()
        run: docker compose -f server/docker-compose.yml down --volumes

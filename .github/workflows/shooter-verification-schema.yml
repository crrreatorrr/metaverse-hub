name: shooter-verification-schema
on:
  pull_request:
    paths:
      - server/modules/src/games/shooter_verification_schema.ts
      - server/test/dup/shooter_verification_schema.ts
      - server/test/dup/suite.ts
      - server/test/unit/shooter_verification_schema.test.ts
      - .github/workflows/shooter-verification-schema.yml
permissions:
  contents: read
jobs:
  postgres-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate throwaway test-stack credentials
        run: |
          set -eu
          sh server/scripts/dev-env.sh --random-server-key
          sed -n 's/^[A-Z_]*=//p' server/.env | while read -r value; do
            echo "::add-mask::${value}"
          done
          for name in NAKAMA_SERVER_KEY NAKAMA_HTTP_KEY; do
            echo "${name}=$(sed -n "s/^${name}=//p" server/.env)" >> "$GITHUB_ENV"
          done
      - name: Boot fresh throwaway Nakama/Postgres database
        run: docker compose -f server/docker-compose.yml up -d --build --wait --wait-timeout 180
      - name: Check schema constraints, populated upgrade and repeat boot
        run: npm run test:dup
        env:
          DUP_ONLY: shooter-verification
      - name: Stop test services
        if: always()
        run: docker compose -f server/docker-compose.yml down --volumes

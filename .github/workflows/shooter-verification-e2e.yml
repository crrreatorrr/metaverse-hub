name: shooter-verification-e2e
on:
  pull_request:
    paths:
      - server/test/dup/shooter_verification_e2e_fixtures.ts
      - server/test/games/shooter_integration_fixture_contract.test.ts
      - server/test/shooter-integration-corpus.test.ts
      - server/test/shooter-full-stack.test.ts
      - server/test/shooter-container-recovery.test.ts
      - server/test/shooter-network-restore.test.ts
      - server/test/shooter-public-adversarial.test.ts
      - server/test/fixtures/shooter-restore.compose.yml
      - server/test/dup/shooter_verification_e2e_operations.ts
      - server/test/dup/shooter_verification_e2e_oracle.ts
      - scripts/shooter-verification/**
      - server/test/fixtures/shooter-integration-corpus.json
      - .github/workflows/shooter-verification-e2e.yml
permissions:
  contents: read
jobs:
  corpus-input-preservation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: crrreatorrr/sproto-shooter
          ref: 05f7a0a245af921fc65a99588564175c19658e38
          path: .ci-shooter
          sparse-checkout: tests/fixtures/replay-corpus
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Exact twelve-trace input preservation (not full-stack execution)
        run: npx tsx server/test/shooter-integration-corpus.test.ts
        env:
          SHOOTER_CORPUS_DIR: ${{ github.workspace }}/.ci-shooter/tests/fixtures/replay-corpus
      - name: Canonical digest and final-tail contracts
        run: npx tsx server/test/games/shooter_integration_fixture_contract.test.ts
  actual-isolated-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: crrreatorrr/sproto-shooter
          ref: 05f7a0a245af921fc65a99588564175c19658e38
          path: .ci-shooter
          sparse-checkout: tests/fixtures/replay-corpus
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Create only disposable test credentials and transport profile
        run: |
          sh server/scripts/dev-env.sh --random-server-key
          echo 'NAKAMA_TEST_MAX_REQUEST_BYTES=23068672' >> server/.env
          sed -n 's/^[A-Z_]*=//p' server/.env | while read -r value; do echo "::add-mask::${value}"; done
          for name in NAKAMA_SERVER_KEY NAKAMA_HTTP_KEY; do
            echo "${name}=$(sed -n "s/^${name}=//p" server/.env)" >> "$GITHUB_ENV"
          done
      - name: Boot actual ephemeral Nakama and PostgreSQL
        run: docker compose -f server/docker-compose.yml up -d --build --wait --wait-timeout 180
      - name: Actual offline-container corpus and DB-only abandoned-run closure
        run: npx tsx server/test/shooter-full-stack.test.ts
        env:
          HUB_SHOOTER_FIXTURE: integration
          SHOOTER_CORPUS_DIR: ${{ github.workspace }}/.ci-shooter/tests/fixtures/replay-corpus
      - name: Stop actual test containers and discard private journals
        if: always()
        run: |
          if test -n "${SHOOTER_OPS_CI_DIRECTORY:-}"; then
            docker compose -f server/docker-compose.yml -f services/shooter-verifier/ops/compose.ci.yml --profile shooter-verification down --volumes
            case "$SHOOTER_OPS_CI_DIRECTORY" in
              "$RUNNER_TEMP"/shooter-e2e-*) sudo rm -rf -- "$SHOOTER_OPS_CI_DIRECTORY" ;;
              *) echo 'Refusing unexpected fixture cleanup directory'; exit 1 ;;
            esac
          else
            docker compose -f server/docker-compose.yml down --volumes
          fi
  actual-game-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: crrreatorrr/sproto-shooter
          ref: 05f7a0a245af921fc65a99588564175c19658e38
          path: .ci-shooter
          sparse-checkout: |
            tests/fixtures/replay-corpus
            src/server/protocol.js
            src/sim/hash.js
            package.json
      - uses: actions/checkout@v4
        with:
          repository: crrreatorrr/sproto-shooter
          ref: 91bd4d79e4429b9bbfb017d92106bea7a9445b5a
          path: .ci-browser-client
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Create only disposable test credentials and transport profile
        run: |
          sh server/scripts/dev-env.sh --random-server-key
          echo 'NAKAMA_TEST_MAX_REQUEST_BYTES=23068672' >> server/.env
          sed -n 's/^[A-Z_]*=//p' server/.env | while read -r value; do echo "::add-mask::${value}"; done
          for name in NAKAMA_SERVER_KEY NAKAMA_HTTP_KEY; do
            echo "${name}=$(sed -n "s/^${name}=//p" server/.env)" >> "$GITHUB_ENV"
          done
      - name: Build exact production Game page with test-only rewarded capability
        working-directory: .ci-browser-client
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
        env:
          VITE_SHOOTER_REWARDED: 'true'
          VITE_NAKAMA_URL: http://127.0.0.1:7350
          VITE_NAKAMA_SERVER_KEY: ${{ env.NAKAMA_SERVER_KEY }}
      - name: Boot actual ephemeral services and production page
        run: |
          docker compose -f server/docker-compose.yml up -d --build --wait --wait-timeout 180
          cd .ci-browser-client
          npm run preview -- --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/shooter-browser-server.log" 2>&1 &
          for attempt in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          echo 'Production page did not start'; exit 1
      - name: Real public DOM prefix and full9634 trusted-server UI trace
        run: npx tsx scripts/shooter-verification/actual-browser-stack.mjs
        env:
          HUB_SHOOTER_FIXTURE: integration
          SHOOTER_CORPUS_DIR: ${{ github.workspace }}/.ci-shooter/tests/fixtures/replay-corpus
          SHOOTER_APPROVED_SOURCE: ${{ github.workspace }}/.ci-shooter
          SHOOTER_BROWSER_CLIENT: ${{ github.workspace }}/.ci-browser-client
      - name: Stop actual test containers and discard private journals
        if: always()
        run: |
          if test -n "${SHOOTER_OPS_CI_DIRECTORY:-}"; then
            docker compose -f server/docker-compose.yml -f services/shooter-verifier/ops/compose.ci.yml --profile shooter-verification down --volumes
            case "$SHOOTER_OPS_CI_DIRECTORY" in
              "$RUNNER_TEMP"/shooter-e2e-*) sudo rm -rf -- "$SHOOTER_OPS_CI_DIRECTORY" ;;
              *) echo 'Refusing unexpected fixture cleanup directory'; exit 1 ;;
            esac
          else
            docker compose -f server/docker-compose.yml down --volumes
          fi

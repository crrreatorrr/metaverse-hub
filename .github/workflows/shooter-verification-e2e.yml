      - name: Stop actual test containers and discard private journals
        if: always()
        run: |
          if test -n "${SHOOTER_RESTORE_PRIVATE_DIRECTORY:-}"; then
            SHOOTER_OPS_CI_DIRECTORY="$SHOOTER_RESTORE_PRIVATE_DIRECTORY" docker compose -p shooter-e2e-restore -f server/docker-compose.yml -f server/test/fixtures/shooter-restore.compose.yml -f services/shooter-verifier/ops/compose.ci.yml --profile shooter-verification down --volumes
            case "$SHOOTER_RESTORE_PRIVATE_DIRECTORY" in
              "$RUNNER_TEMP"/shooter-e2e-restore-*) sudo rm -rf -- "$SHOOTER_RESTORE_PRIVATE_DIRECTORY" ;;
              *) echo 'Refusing unexpected restore fixture directory'; exit 1 ;;
            esac
          fi
          if test -n "${SHOOTER_OPS_CI_DIRECTORY:-}"; then
            docker compose -f server/docker-compose.yml -f services/shooter-verifier/ops/compose.ci.yml --profile shooter-verification down --volumes
            case "$SHOOTER_OPS_CI_DIRECTORY" in

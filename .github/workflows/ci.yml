name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Check Coop simulation pin
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-coop-sim-version.mjs
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
      - name: Check Shooter simulation pin
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-shooter-sim-version.mjs
      - name: Check Shooter free-arena pin
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-shooter-pvp-sim-version.mjs
      - run: npm test
        env:
          SHOOTER_REQUIRE_GOJA: '1'
          GOTOOLCHAIN: local
      - run: npm run build
        env:
          # Placeholder so the production build passes its empty-key guard. No server accepts it.
          VITE_NAKAMA_SERVER_KEY: ci-build-placeholder-not-a-server-key
      - name: Hub dist has no secrets
        run: deploy/scripts/check-dist-secrets.sh --defaults-only apps/hub/dist

  duplication:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate throwaway Nakama keys
        # Fresh random keys for this run only, written to the gitignored
        # server/.env. The test process gets the two keys it needs through
        # GITHUB_ENV, masked so they never show in the log.
        run: |
          set -eu
          sh server/scripts/dev-env.sh --random-server-key
          echo 'NAKAMA_TEST_MAX_REQUEST_BYTES=23068672' >> server/.env
          sed -n 's/^[A-Z_]*=//p' server/.env | while read -r value; do
            echo "::add-mask::${value}"
          done
          for name in NAKAMA_SERVER_KEY NAKAMA_HTTP_KEY; do
            echo "${name}=$(sed -n "s/^${name}=//p" server/.env)" >> "$GITHUB_ENV"
          done
      - name: Start Nakama
        run: |
          set -eu
          for attempt in 1 2 3; do
            if docker pull heroiclabs/nakama:3.41.0 &&
               docker pull postgres:16.8-alpine &&
               docker pull caddy:2.10.2-alpine &&
               docker compose -f server/docker-compose.yml up -d --build --wait --wait-timeout 180; then
              exit 0
            fi
            echo "compose attempt ${attempt} failed"
            docker compose -f server/docker-compose.yml down || true
            sleep $((attempt * 15))
          done
          exit 1
      - run: npm run test:dup
        timeout-minutes: 120
        env:
          HUB_RECOVERY_FIXTURE: retention-restore
      - run: npm run test:rt
        timeout-minutes: 10
      - name: Coop authoritative match
        run: npx tsx scripts/load/coop-bots.ts
        timeout-minutes: 15
      - name: Shooter free match
        run: npx tsx scripts/load/shooter-bots.ts
        timeout-minutes: 15
      - name: Coop H5 acceptance
        run: npx tsx scripts/load/coop-acceptance.ts
        timeout-minutes: 20
      - name: Shooter H5 acceptance
        run: npx tsx scripts/load/shooter-acceptance.ts
        timeout-minutes: 20
      - name: Economy audit
        if: always()
        run: |
          docker compose -f server/docker-compose.yml exec -T postgres psql -U postgres -d nakama -v ON_ERROR_STOP=1 -q -f - < server/test/dup/audit.sql
          docker compose -f server/docker-compose.yml exec -T postgres psql -U postgres -d nakama -v ON_ERROR_STOP=1 -q -f - < server/test/dup/shooter_wager_audit.sql
          docker compose -f server/docker-compose.yml exec -T postgres psql -U postgres -d nakama -v ON_ERROR_STOP=1 -q -f - < server/test/dup/sproto_wager_audit.sql
      - if: failure()
        run: docker compose -f server/docker-compose.yml logs --no-color --tail 200 nakama

name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Contract tests (unit, fuzz, invariant, exploit PoCs, shared vectors)
        working-directory: contracts
        run: |
          forge fmt --check
          forge test

  exchange:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.8-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      EXCHANGE_TEST_DB: postgres://postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix server/modules
      - run: npm ci --prefix server/chain
      - name: Exchange schema tests
        run: npm run test:exchange
      - name: Chain service typecheck and tests
        working-directory: server/chain
        run: |
          npm run typecheck
          npm test

  duplication:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start Nakama
        run: |
          set -eu
          for attempt in 1 2 3; do
            if docker pull heroiclabs/nakama:3.41.0 &&
               docker pull postgres:16.8-alpine &&
               docker pull caddy:2.10.2-alpine &&
               docker compose -f server/docker-compose.yml up -d --build --wait --wait-timeout 180; then
              exit 0
            fi
            echo "compose attempt ${attempt} failed"
            docker compose -f server/docker-compose.yml down || true
            sleep $((attempt * 15))
          done
          exit 1
      - run: npm run test:dup
        timeout-minutes: 50
      - name: Economy audit
        if: always()
        run: docker compose -f server/docker-compose.yml exec -T postgres psql -U postgres -d nakama -v ON_ERROR_STOP=1 -q -f - < server/test/dup/audit.sql
      - if: failure()
        run: docker compose -f server/docker-compose.yml logs --no-color --tail 200 nakama

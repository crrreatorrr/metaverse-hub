name: shooter-pin-artifacts
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact reviewed Shooter commit (40 lowercase hex characters)
        required: true
        type: string
  pull_request:
    paths: ['.github/workflows/shooter-pin-artifacts.yml']
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SHOOTER_PIN_SOURCE_COMMIT: ${{ inputs.source_commit || '7960d8525627a56ef2415ba9ff70e7ffe7784465' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate pins with the existing scrubbed-environment re-vendor tool
        run: node scripts/revendor-shooter-pvp.mjs "$SHOOTER_PIN_SOURCE_COMMIT"
      - name: Validate generated campaign and PvP artifacts against current source main
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/check-shooter-sim-version.mjs
          node scripts/check-shooter-pvp-sim-version.mjs
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
      - name: Validate generated artifacts with Hub unit tests
        env:
          SHOOTER_REQUIRE_GOJA: '1'
          GOTOOLCHAIN: local
        run: npm test
      - name: Export exact generated bytes and patch without pushing
        run: |
          mkdir -p ci-artifacts
          git diff --binary --output=ci-artifacts/shooter-pin.patch
          sha256sum server/modules/vendor/shooter-sim.js server/modules/vendor/shooter-pvp-sim.js > ci-artifacts/shooter-pin-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: shooter-pin-generated
          path: |
            ci-artifacts/shooter-pin.patch
            ci-artifacts/shooter-pin-sha256.txt
            server/modules/vendor/shooter-sim.js
            server/modules/vendor/shooter-sim.pin.json
            server/modules/vendor/shooter-pvp-sim.js
            server/modules/vendor/shooter-pvp-sim.pin.json
          if-no-files-found: error

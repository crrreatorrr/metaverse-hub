<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Metaverse Hub</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%2307060f' width='32' height='32'/%3E%3Ccircle cx='16' cy='16' r='6' fill='none' stroke='%233de1ff' stroke-width='2'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app">
      <div id="hud">
        <div class="brand">METAVERSE HUB<span id="link-status">Four Lights</span></div>
        <div id="verse" class="verse">Verse 0</div>
        <div id="bar-tabs" class="bar-tabs" hidden>
          <span>Bar board</span>
          <button type="button" data-tab="hpos10i">HPOS10I</button>
          <button type="button" data-tab="nobu">NOBU</button>
          <button type="button" data-tab="pb">Bitcoin</button>
          <button type="button" data-tab="sproto">Sproto</button>
          <button type="button" data-tab="total" class="on">Total</button>
        </div>
        <div id="relics" class="relic-tray"></div>
        <button id="account-toggle" class="account-toggle" type="button">Account</button>
        <section id="account" class="account" hidden>
          <p id="account-id" class="account-id">Guest</p>
          <button id="recovery-create" type="button">Create recovery code</button>
          <p id="recovery-code" class="recovery-code" hidden></p>
          <p class="fine">Shown once. Save it somewhere else. Clearing site data without this code loses this guest.</p>
          <label class="restore">Restore on this device
            <input id="recovery-input" autocomplete="off" spellcheck="false" placeholder="XXXX-XXXX-XXXX-XXXX" />
          </label>
          <button id="recovery-restore" type="button">Restore</button>
          <p id="account-status" class="account-status"></p>
        </section>
        <div id="banner" class="banner" hidden>Desktop only. This plaza uses a mouse and keyboard.</div>
        <div id="hint" class="hint">Click to look · WASD move · Shift sprint · Space jump</div>
        <div id="debug" class="debug" hidden></div>
      </div>
      <div id="wipe"></div>
    </div>
    <script type="module" src="../src/main.ts"></script>
  </body>
</html>

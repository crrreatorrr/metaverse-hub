# Local Nakama stack. From this directory: `docker compose up`.
# The plaza (`npm run dev`) proxies /v2 to Nakama on port 7350.
# Keys below are local dev credentials, not production secrets.

name: metaverse-hub

services:
  postgres:
    image: postgres:16.8-alpine
    environment:
      POSTGRES_DB: nakama
      POSTGRES_PASSWORD: localdb
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "nakama"]
      interval: 3s
      timeout: 3s
      retries: 10

  nakama:
    build:
      context: .
      dockerfile: Dockerfile
    image: metaverse-nakama:local
    entrypoint:
      - /bin/sh
      - -ecx
      - |
        /nakama/nakama migrate up --database.address postgres:localdb@postgres:5432/nakama
        exec /nakama/nakama \
          --name metaverse \
          --database.address postgres:localdb@postgres:5432/nakama \
          --logger.level INFO \
          --session.token_expiry_sec 7200 \
          --runtime.http_key localhttpkey \
          --runtime.env TICKET_HMAC_KEY=dev-ticket-hmac-key \
          --runtime.env RECOVERY_PEPPER=dev-recovery-pepper \
          --runtime.env AUDIT_KEY=dev-audit-key
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "7349:7349"
      - "7350:7350"
      - "7351:7351"
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 25s

  caddy:
    image: caddy:2.10.2-alpine
    depends_on:
      nakama:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro

volumes:
  postgres-data:

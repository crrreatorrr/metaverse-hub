# Local Nakama stack. From this directory: `docker compose up`.
# The plaza (`npm run dev`) proxies /v2 to Nakama on port 7350.
# Every key comes from server/.env (gitignored, mode 600), never from this file.
# Create it once with `sh scripts/dev-env.sh` (see .env.example). Compose stops
# with an error if a key is missing. Ports are published on 127.0.0.1 only.
# HUB_FAULT_INJECT is the duplication-suite hook. It does nothing unless a row
# is armed in game.fault_arm (the test harness does that as postgres). Leave
# the flag unset on a production deploy.

name: metaverse-hub

services:
  postgres:
    image: postgres:16.8-alpine
    environment:
      POSTGRES_DB: nakama
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in server/.env (sh scripts/dev-env.sh)}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "nakama"]
      interval: 3s
      timeout: 3s
      retries: 10

  nakama:
    build:
      context: .
      dockerfile: Dockerfile
    image: metaverse-nakama:local
    env_file:
      - path: .env
        required: true
    entrypoint:
      - /bin/sh
      - -ec
      - |
        : "$${POSTGRES_PASSWORD:?}" "$${NAKAMA_SERVER_KEY:?}" "$${NAKAMA_HTTP_KEY:?}"
        : "$${NAKAMA_SESSION_ENCRYPTION_KEY:?}" "$${NAKAMA_REFRESH_ENCRYPTION_KEY:?}"
        : "$${NAKAMA_CONSOLE_USERNAME:?}" "$${NAKAMA_CONSOLE_PASSWORD:?}" "$${NAKAMA_CONSOLE_SIGNING_KEY:?}"
        : "$${TICKET_HMAC_KEY:?}" "$${RECOVERY_PEPPER:?}" "$${AUDIT_KEY:?}"
        set +x
        DB="postgres:$${POSTGRES_PASSWORD}@postgres:5432/nakama"
        /nakama/nakama migrate up --database.address "$$DB"
        exec /nakama/nakama \
          --name metaverse \
          --database.address "$$DB" \
          --logger.level INFO \
          --session.token_expiry_sec 7200 \
          --socket.server_key "$$NAKAMA_SERVER_KEY" \
          --runtime.http_key "$$NAKAMA_HTTP_KEY" \
          --session.encryption_key "$$NAKAMA_SESSION_ENCRYPTION_KEY" \
          --session.refresh_encryption_key "$$NAKAMA_REFRESH_ENCRYPTION_KEY" \
          --console.username "$$NAKAMA_CONSOLE_USERNAME" \
          --console.password "$$NAKAMA_CONSOLE_PASSWORD" \
          --console.signing_key "$$NAKAMA_CONSOLE_SIGNING_KEY" \
          --runtime.env "TICKET_HMAC_KEY=$$TICKET_HMAC_KEY" \
          --runtime.env "RECOVERY_PEPPER=$$RECOVERY_PEPPER" \
          --runtime.env "AUDIT_KEY=$$AUDIT_KEY" \
          --runtime.env HUB_FAULT_INJECT=1
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:7349:7349"
      - "127.0.0.1:7350:7350"
      - "127.0.0.1:7351:7351"
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 25s

  caddy:
    image: caddy:2.10.2-alpine
    depends_on:
      nakama:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro

volumes:
  postgres-data:

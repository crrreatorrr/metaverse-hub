# Template. deploy/nakama/render-config.sh substitutes the placeholders below
# from the container environment, and Nakama loads the rendered file. Do not
# pass this file to Nakama directly. Values come from deploy/.env.
# HUB_FAULT_INJECT is unset on purpose: the duplication-suite hook stays inert.

name: metaverse
data_dir: "/nakama/data"

logger:
  level: "info"
  stdout: true

database:
  address:
    - "postgres:${POSTGRES_PASSWORD}@postgres:5432/nakama"

runtime:
  path: "/nakama/data/modules"
  http_key: "${NAKAMA_HTTP_KEY}"
  env:
    - "TICKET_HMAC_KEY=${TICKET_HMAC_KEY}"
    - "RECOVERY_PEPPER=${RECOVERY_PEPPER}"

socket:
  server_key: "${NAKAMA_SERVER_KEY}"
  port: 7350
  # 15s server pings keep the browser socket inside Cloudflare's idle window.
  ping_period_ms: 15000
  pong_wait_ms: 25000

session:
  encryption_key: "${NAKAMA_SESSION_ENCRYPTION_KEY}"
  refresh_encryption_key: "${NAKAMA_REFRESH_ENCRYPTION_KEY}"
  token_expiry_sec: 7200
  refresh_token_expiry_sec: 604800

console:
  port: 7351
  username: "${NAKAMA_CONSOLE_USERNAME}"
  password: "${NAKAMA_CONSOLE_PASSWORD}"
  signing_key: "${NAKAMA_CONSOLE_SIGNING_KEY}"

shutdown_grace_sec: 15

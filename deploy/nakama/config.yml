# Template. deploy/nakama/render-config.sh substitutes the placeholders below
# from the container environment, and Nakama loads the rendered file. Do not
# pass this file to Nakama directly. Values come from deploy/.env.
# HUB_FAULT_INJECT is unset on purpose: the duplication-suite hook stays inert.
# SHOOTER_PVP_REPLAY is unset on purpose: free Shooter matches keep no replay
# record (docs/games/sproto-shooter-free.md). Wagers will turn it on.

name: metaverse
data_dir: "/nakama/data"

logger:
  level: "info"
  stdout: true

database:
  address:
    - "postgres:${POSTGRES_PASSWORD}@postgres:5432/nakama"

runtime:
  path: "/nakama/data/modules"
  http_key: "${NAKAMA_HTTP_KEY}"
  # Each hub shard / PB world is one match VM; RPCs and hooks draw from the same pool.
  js_max_count: 64
  env:
    - "TICKET_HMAC_KEY=${TICKET_HMAC_KEY}"
    - "RECOVERY_PEPPER=${RECOVERY_PEPPER}"

socket:
  server_key: "${NAKAMA_SERVER_KEY}"
  port: 7350
  # 15s server pings keep the browser socket inside Cloudflare's idle window.
  ping_period_ms: 15000
  pong_wait_ms: 25000
  # Plaza deltas at 100 players are ~3 KB; PB snapshots must stay under this cap.
  max_message_size_bytes: 8192
  # Nakama's 10s default cuts the socket before a long campaign verify can write
  # its receipt. Stay above the 15s verifier budget. The budget itself is unchanged.
  read_timeout_ms: 30000
  write_timeout_ms: 30000
  outgoing_queue_size: 256

match:
  input_queue_size: 256
  call_queue_size: 256

session:
  encryption_key: "${NAKAMA_SESSION_ENCRYPTION_KEY}"
  refresh_encryption_key: "${NAKAMA_REFRESH_ENCRYPTION_KEY}"
  token_expiry_sec: 7200
  refresh_token_expiry_sec: 604800

console:
  port: 7351
  username: "${NAKAMA_CONSOLE_USERNAME}"
  password: "${NAKAMA_CONSOLE_PASSWORD}"
  signing_key: "${NAKAMA_CONSOLE_SIGNING_KEY}"

# Seconds Nakama gives running matches to finish matchTerminate on SIGTERM. compose.yml's
# stop_grace_period (90s) must stay above this, or Docker SIGKILLs Nakama first.
shutdown_grace_sec: 60

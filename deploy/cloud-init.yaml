#cloud-config
# Optional Hetzner user data. Paste this when creating the server.
# It closes inbound ports except SSH, turns off password login, and enables
# unattended security upgrades. It does not install Docker, Caddy, or secrets.
# After the first boot, clone the repo and run deploy/scripts/bootstrap.sh.

package_update: true
package_upgrade: true
timezone: Etc/UTC

packages:
  - unattended-upgrades
  - ufw
  - ca-certificates
  - curl
  - git
  - rsync
  - brotli

ssh_pwauth: false
disable_root: false

write_files:
  - path: /etc/apt/apt.conf.d/20auto-upgrades
    permissions: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";
  - path: /etc/apt/apt.conf.d/51metaverse-unattended
    permissions: "0644"
    content: |
      Unattended-Upgrade::Automatic-Reboot "false";
      Unattended-Upgrade::Remove-Unused-Dependencies "true";
  - path: /etc/ssh/sshd_config.d/99-metaverse.conf
    permissions: "0644"
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin prohibit-password
      PubkeyAuthentication yes

runcmd:
  - systemctl enable --now unattended-upgrades
  - systemctl enable --now systemd-timesyncd
  - sed -i 's/^IPV6=no/IPV6=yes/' /etc/default/ufw
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp comment ssh-admin
  - ufw --force enable
  - sshd -t
  - systemctl reload ssh || systemctl reload sshd

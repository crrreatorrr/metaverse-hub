# Nakama and Postgres for one VPS. Caddy runs on the host and proxies to
# 127.0.0.1:7350. Publishing 80/443 from this file would bypass ufw, so those
# ports are not here. 7350 and the console (7351) bind the host loopback only.
# Postgres is not published. Secrets come from deploy/.env.

name: metaverse-prod

services:
  postgres:
    image: postgres:16.8-alpine
    environment:
      POSTGRES_DB: nakama
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "nakama"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  nakama:
    build:
      context: ../server
      dockerfile: Dockerfile
    image: metaverse-nakama:prod
    entrypoint: ["/bin/sh", "/etc/nakama/render-config.sh"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      NAKAMA_SERVER_KEY: ${NAKAMA_SERVER_KEY:?set NAKAMA_SERVER_KEY in deploy/.env}
      NAKAMA_HTTP_KEY: ${NAKAMA_HTTP_KEY:?set NAKAMA_HTTP_KEY in deploy/.env}
      NAKAMA_SESSION_ENCRYPTION_KEY: ${NAKAMA_SESSION_ENCRYPTION_KEY:?set NAKAMA_SESSION_ENCRYPTION_KEY in deploy/.env}
      NAKAMA_REFRESH_ENCRYPTION_KEY: ${NAKAMA_REFRESH_ENCRYPTION_KEY:?set NAKAMA_REFRESH_ENCRYPTION_KEY in deploy/.env}
      NAKAMA_CONSOLE_USERNAME: ${NAKAMA_CONSOLE_USERNAME:-admin}
      NAKAMA_CONSOLE_PASSWORD: ${NAKAMA_CONSOLE_PASSWORD:?set NAKAMA_CONSOLE_PASSWORD in deploy/.env}
      NAKAMA_CONSOLE_SIGNING_KEY: ${NAKAMA_CONSOLE_SIGNING_KEY:?set NAKAMA_CONSOLE_SIGNING_KEY in deploy/.env}
      TICKET_HMAC_KEY: ${TICKET_HMAC_KEY:?set TICKET_HMAC_KEY in deploy/.env}
      RECOVERY_PEPPER: ${RECOVERY_PEPPER:?set RECOVERY_PEPPER in deploy/.env}
    volumes:
      - ./nakama/config.yml:/etc/nakama/config.yml.template:ro
      - ./nakama/render-config.sh:/etc/nakama/render-config.sh:ro
    ports:
      - "127.0.0.1:7350:7350"
      - "127.0.0.1:7351:7351"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 25s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  postgres-data:
